name: Baseline checks
on:
  push:
  pull_request:
jobs:
  exact-enumeration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/count_full_multistability.py --max-n 5
      - run: python3 scripts/check_local_coefficients.py
      - run: python3 -m unittest discover -s tests -v
